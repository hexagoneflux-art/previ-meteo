name: previ-meteo

# Un passage toutes les 30 min dans les fenêtres où les runs 00/06/12/18 h UTC deviennent disponibles
# (AROME ~+3 h, ARPEGE ~+4 h) : 3-5 h, 9-11 h, 15-17 h et 21-23 h UTC, soit 24 passages par jour.
# Chaque passage s'arrête en quelques secondes s'il n'y a rien de nouveau (aucune écriture KV).
# Dépôt PUBLIC : minutes GitHub Actions gratuites et illimitées. Les workflows programmés sont
# désactivés après 60 jours sans activité : voir keepalive.yml.
# Seuls les runs de 00, 06, 12 et 18 h UTC sont publiés (4 × 177 écritures = 708/jour < 1 000, limite KV gratuite).
on:
  schedule:
    - cron: "0,30 3-5,9-11,15-17,21-23 * * *"
  workflow_dispatch:
    inputs:
      discover:
        description: "Lister les couvertures disponibles (1er test)"
        type: boolean
        default: false
      sonde:
        description: "Sonde : 1 appel par modèle (vérifie clé, format, valeurs) — avant le 1er run complet"
        type: boolean
        default: false
      force:
        description: "Forcer même sans nouveau run"
        type: boolean
        default: false

concurrency:
  group: previ-meteo
  cancel-in-progress: false

jobs:
  previ:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Lister les couvertures
        if: ${{ inputs.discover }}
        env:
          MF_KEY_AROME: ${{ secrets.MF_KEY_AROME }}
          MF_KEY_ARPEGE: ${{ secrets.MF_KEY_ARPEGE }}
        run: python previ.py --discover
      - name: Sonde (1 appel par modèle)
        if: ${{ inputs.sonde }}
        env:
          MF_KEY_AROME: ${{ secrets.MF_KEY_AROME }}
          MF_KEY_ARPEGE: ${{ secrets.MF_KEY_ARPEGE }}
        run: python previ.py --sonde
      - name: Préparer les prévisions
        if: ${{ !inputs.discover && !inputs.sonde }}
        env:
          MF_KEY_AROME: ${{ secrets.MF_KEY_AROME }}
          MF_KEY_ARPEGE: ${{ secrets.MF_KEY_ARPEGE }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python previ.py ${{ inputs.force && '--force' || '' }}
